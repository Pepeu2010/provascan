name: Feature request
description: Suggest a focused improvement for ProvaScan
title: "[Feature]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem first, then the proposed solution. Avoid including real student data or credentials.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or operational problem would this solve?
      placeholder: Explain the current limitation or friction.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the behavior you would like to see.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Authentication / MFA
        - Dashboard
        - Classes / students
        - Exams / answer keys
        - OCR / OMR / correction
        - Collaborative exams
        - Printing / PDF
        - Results / analytics
        - Accessibility / UX
        - Security / reliability
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional. Mention workarounds or other approaches you considered.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add sanitized mockups, examples or constraints if useful.

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues before opening this request.
          required: true
        - label: This request does not include credentials or personal data.
          required: true
